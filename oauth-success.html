<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>EVEN | Signing In</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Inter, Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;
        }

        .box {

            width: 420px;

            max-width: 90%;

            padding: 45px;

            text-align: center;

            border-radius: 24px;

            background:
                rgba(255,255,255,.14);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.25);
        }

        .icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 20px;

            background: white;

            color: #667eea;

            font-size: 30px;

            font-weight: 800;
        }

        h1 {

            margin: 0 0 10px;

            font-size: 30px;
        }

        p {

            margin: 0;

            opacity: .85;
        }

        .loader {

            width: 40px;

            height: 40px;

            margin: 25px auto 0;

            border: 4px solid
                rgba(255,255,255,.3);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>

    <div class="box">

        <div class="icon">
            E
        </div>

        <h1>
            Welcome to EVEN
        </h1>

        <p>
            Completing your sign in...
        </p>

        <div class="loader"></div>

    </div>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");

        const userId =
            params.get("userId");

        const fullName =
            params.get("fullName");

        const username =
            params.get("username");

        const email =
            params.get("email");

        const role =
            params.get("role");


        if (!token) {

            document.querySelector("p")
                .textContent =
                "Authentication failed.";

            document.querySelector(".loader")
                .style.display = "none";

        } else {


            // =========================
            // SAVE LOGIN
            // =========================

            localStorage.setItem(
                "token",
                token
            );

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            localStorage.setItem(
                "userId",
                userId || ""
            );

            localStorage.setItem(
                "fullName",
                fullName || ""
            );

            localStorage.setItem(
                "username",
                username || ""
            );

            localStorage.setItem(
                "email",
                email || ""
            );

            localStorage.setItem(
                "role",
                role || "USER"
            );


            // =========================
            // DASHBOARD
            // =========================

            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            }, 700);

        }

    </script>

</body>

</html>
