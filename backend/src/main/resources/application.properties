# =====================================================
# EVEN BACKEND
# =====================================================

spring.application.name=EVEN Backend

server.port=8081


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/even_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=Even@2026#Root


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false


