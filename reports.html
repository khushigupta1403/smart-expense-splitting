<section class="main">



<header>


<div>

<h1>
Expense Reports
</h1>

<p>
Review and export your transactions
</p>


</div>



<div class="actions">

<button onclick="downloadCSV()">

<i class="fa-solid fa-download"></i>

CSV

</button>


<button onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print

</button>


</div>


</header>








<div class="summary">


<div class="card">

<i class="fa-solid fa-wallet"></i>

<div>

<p>Total Spending</p>

<h2 id="total">
₹0
</h2>

</div>

</div>





<div class="card">

<i class="fa-solid fa-receipt"></i>

<div>

<p>Total Transactions</p>

<h2 id="transactions">
0
</h2>

</div>

</div>



<div class="card">

<i class="fa-solid fa-users"></i>

<div>

<p>Groups Used</p>

<h2 id="groups">
0
</h2>

</div>

</div>



</div>









<div class="table-box">


<div class="search">


<i class="fa-solid fa-search"></i>


<input
id="search"
placeholder="Search expense..."
onkeyup="searchReport()">



</div>





<table>


<thead>

<tr>

<th>
Title
</th>


<th>
Group
</th>


<th>
Paid By
</th>


<th>
Amount
</th>


<th>
Split
</th>


</tr>


</thead>


<tbody id="reportTable">


</tbody>


</table>
