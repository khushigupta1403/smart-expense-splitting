<section class="main">



<header>

<h1>
My Profile
</h1>

<p>
Manage your personal information
</p>


</header>







<div class="profile-container">



<div class="profile-card">


<div class="image-box">


<img id="profileImage"
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">


<input
type="file"
id="imageUpload"
accept="image/*"
onchange="uploadImage()">



</div>



<h2 id="displayName">
Khushi Gupta
</h2>


<p id="displayEmail">
khushi@email.com
</p>



</div>







<div class="form-card">


<h2>
Edit Profile
</h2>



<label>
Full Name
</label>


<input
id="name"
placeholder="Enter name">





<label>
Email
</label>


<input
id="email"
placeholder="Enter email">





<label>
Phone
</label>


<input
id="phone"
placeholder="Enter phone">





<button onclick="saveProfile()">

Save Changes

</button>


</div>







<div class="form-card">


<h2>
Change Password
</h2>


<input
type="password"
id="oldPassword"
placeholder="Current Password">


<input
type="password"
id="newPassword"
placeholder="New Password">


<button onclick="changePassword()">

Update Password

</button>


</div>





</div>




</section>




<script src="js/api.js"></script>
